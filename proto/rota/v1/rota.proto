syntax = "proto3";

// Package rota.v1 is the ONE schema for Rota: it defines both the gRPC wire
// contract and (reused) the durable value types stored in Pebble. Everything
// here is strictly domain-neutral. Rota's whole vocabulary is Lane, Group,
// Message, Lease, Policy, Consumer, Cron, Singleton, DeadLetter. It does not
// know what a "run", "model", or "tenant" is; those ride opaquely in `payload`
// bytes and the `headers` map.
package rota.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/tinkerhaus/rota/gen/rota/v1;rotav1";

// ─────────────────────────────────────────────────────────────────────────────
// Services
// ─────────────────────────────────────────────────────────────────────────────

// Broker is the data plane: publishing work and the bidirectional Work stream
// over which consumers lease, ack/nack, extend, and complete messages.
service Broker {
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc PublishBatch(PublishBatchRequest) returns (PublishBatchResponse);
  // Work is a long-lived bidirectional stream. The client advertises demand
  // (credit) and acks/nacks; the server pushes leases and flow-control frames.
  rpc Work(stream WorkClientMsg) returns (stream WorkServerMsg);
}

// Control is the control plane: group config + lifecycle, programmable policy
// management, cron, singleton leases, off-stream completion, and introspection.
service Control {
  // Group configuration.
  rpc SetGroupConfig(SetGroupConfigRequest) returns (GroupConfig);
  rpc GetGroupConfig(GroupRef) returns (GroupConfig);

  // Group lifecycle. Operating on an absent group is a benign no-op.
  rpc PauseGroup(GroupRef) returns (GroupConfig);
  rpc ResumeGroup(GroupRef) returns (GroupConfig);
  rpc CancelGroup(GroupRef) returns (GroupOpResult);   // drop READY/DELAYED, drain in-flight
  rpc PurgeGroup(GroupRef) returns (GroupOpResult);     // drop everything leasable, keep config
  rpc ReapGroup(GroupRef) returns (GroupOpResult);      // idle-reap (asserts empty)
  rpc TeardownGroup(TeardownRequest) returns (TeardownResult); // one call across ALL lanes

  // Lane configuration + back-pressure hooks.
  rpc SetLaneConfig(SetLaneConfigRequest) returns (LaneConfig);
  rpc PauseLane(PauseLaneRequest) returns (LaneOpResult);   // stop leasing a lane (circuit breaker hook)
  rpc ResumeLane(LaneRef) returns (LaneOpResult);

  // Programmable policy (hot-reloadable).
  rpc SetPolicy(SetPolicyRequest) returns (PolicyInfo);
  rpc GetPolicy(LaneRef) returns (PolicyInfo);
  rpc ValidatePolicy(SetPolicyRequest) returns (ValidatePolicyResult); // compile + dry-run, no install

  // Cron (generic recurring publish).
  rpc ScheduleCron(ScheduleCronRequest) returns (CronInfo); // idempotent on cron_id
  rpc ListCron(ListCronRequest) returns (ListCronResponse);
  rpc DeleteCron(CronRef) returns (CronOpResult);
  rpc PauseCron(CronRef) returns (CronInfo);

  // Singleton leases (generic cluster-wide single-instance coordination).
  rpc AcquireSingletonLease(AcquireSingletonRequest) returns (SingletonLease);
  rpc RenewSingletonLease(RenewSingletonRequest) returns (SingletonLease);
  rpc ReleaseSingletonLease(ReleaseSingletonRequest) returns (SingletonOpResult);

  // Async completion off-stream (twin of the in-stream Complete frame).
  rpc CompleteByToken(CompleteByTokenRequest) returns (CompleteResult);

  // Introspection.
  rpc GetStats(GetStatsRequest) returns (StatsResponse);
  rpc DescribeCluster(DescribeClusterRequest) returns (ClusterInfo);
  rpc Health(HealthRequest) returns (HealthResponse);

  // Read-only introspection for the operator dashboard. Paginated; follower-servable
  // (NOT in the leader-guard set) so reads scale off any node's local replica.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);            // per-group fairness grid
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse); // DLQ inspector
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);            // in-flight lease inspector
  rpc PeekMessages(PeekMessagesRequest) returns (PeekMessagesResponse);      // non-destructive group head read

  // Fairness Observatory (read-only; leader holds the in-memory projection, but
  // both are follower-servable — a follower simply reports its own local view).
  rpc GetLaneFairness(LaneRef) returns (LaneFairness);   // per-group fairness snapshot
  rpc GetPolicyHealth(LaneRef) returns (PolicyHealth);   // policy version / quarantine / fault state

  // Operator action: re-publish a dead letter onto its lane (mutating; leader-guarded).
  rpc RedriveDeadLetter(RedriveDeadLetterRequest) returns (RedriveDeadLetterResponse);

  // Auth administration. Principals, token hashes, tags, and grants are
  // replicated state; raw tokens are returned only on create/rotate.
  rpc CreatePrincipal(CreatePrincipalRequest) returns (CreatePrincipalResponse);
  rpc RotatePrincipalToken(RotatePrincipalTokenRequest) returns (RotatePrincipalTokenResponse);
  rpc SetPrincipalDisabled(SetPrincipalDisabledRequest) returns (AuthOpResult);
  rpc GrantPrincipal(GrantPrincipalRequest) returns (AuthOpResult);
  rpc RevokePrincipalGrant(RevokePrincipalGrantRequest) returns (AuthOpResult);
  rpc ListPrincipals(ListPrincipalsRequest) returns (ListPrincipalsResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
// Core domain value types (reused on the wire AND on disk in Pebble)
// ─────────────────────────────────────────────────────────────────────────────

enum MessageState {
  MESSAGE_STATE_UNSPECIFIED = 0;
  READY = 1;     // leasable now
  DELAYED = 2;   // not_before in the future
  LEASED = 3;    // exclusively granted to a consumer until a deadline
  DEAD = 4;      // dead-lettered
  DONE = 5;      // acked / completed, pending delete
}

// Message is the unit of work. Tiny (ids + flags, KB-scale); bulk content lives
// in the consumer's own store, referenced by id inside `payload`/`headers`.
message Message {
  uint64 msg_id = 1;                    // per-group monotonic seq, leader-assigned in Apply
  string lane = 2;
  string group_id = 3;                  // "" is the default group
  bytes payload = 4;                    // opaque
  map<string, string> headers = 5;      // app metadata; surfaced on delivery, carried into DLQ
  uint64 not_before_ms = 6;             // delayed publish: not leasable until T (unix ms)
  uint64 ttl_ms = 7;                    // 0 = none; else auto-drop/DLQ if undelivered by then
  uint32 attempt = 8;                   // BROKER-OWNED; publishers cannot set it
  uint32 max_attempts = 9;             // 0 = lane default
  uint64 enqueue_ms = 10;               // broker-set
  MessageState state = 11;
  uint32 epoch = 12;                    // bumped on every state change; idempotency linchpin
  uint64 cur_lease = 13;                // lease id while LEASED
  bool issue_token = 14;                // mint a completion token at lease time
  bytes external_token = 15;            // producer-supplied completion token (optional)
}

// GroupMeta holds BOTH the live knobs and the fairness counters, quorum-written
// in the same store as messages (this is what kills "redis flush loses weights").
message GroupMeta {
  string lane = 1;
  string group_id = 2;
  double weight = 3;                    // scheduling FREQUENCY (turns/cycle); default 1.0; <=0 => paused
  uint32 batch_size = 4;                // messages leased per turn; default 1
  bool paused = 5;
  double deficit = 6;                   // DRR deficit (broker-maintained)
  double virtual_time = 7;             // WFQ virtual finish time (broker-maintained)
  uint64 ready_count = 8;
  uint64 inflight_count = 9;
  uint64 total_count = 10;
  uint64 next_seq = 11;
  int64 last_served_seq = 12;
  int64 last_served_ts = 13;
  uint64 last_activity_ms = 14;
  uint64 delayed_count = 15;            // messages DELAYED (not-before in the future)
}

// Lease is a time-bounded exclusive grant (SQS-style visibility timeout).
message Lease {
  uint64 lease_id = 1;
  uint64 msg_id = 2;
  string lane = 3;
  string group_id = 4;
  string consumer_id = 5;
  uint64 deadline_ms = 6;              // visibility expiry; mirrored as a LEASE_DEADLINE timer
  uint32 attempt_at_lease = 7;
  uint32 epoch = 8;                    // must match Message.epoch; stale ops are benign no-ops
  uint32 extend_count = 9;
  bytes completion_token_hash = 10;    // set => complete-by-token mode (sha256 of minted token)
  uint64 granted_ms = 11;
}

message DeadLetter {
  Message original = 1;
  uint32 final_attempt = 2;
  string reason = 3;                    // "max_attempts" | "terminal_nack" | "ttl" | "max_lease_lifetime"
  map<string, string> failure_headers = 4;
  uint64 dead_at_ms = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// Publish
// ─────────────────────────────────────────────────────────────────────────────

// MessageSpec is what a publisher submits. `not_before` expresses the single
// "becomes eligible at" instant in either spelling: a relative `delay` or an
// absolute `at`. Setting neither = eligible now. Setting both is an error.
message MessageSpec {
  string lane = 1;
  string group_id = 2;                  // required
  bytes payload = 3;
  map<string, string> headers = 4;

  oneof not_before {
    google.protobuf.Duration delay = 5;        // relative
    google.protobuf.Timestamp at = 6;          // absolute (canonical instant)
  }

  uint32 max_attempts = 7;             // 0 = lane default
  RetryBackoff retry_backoff = 8;       // optional override
  google.protobuf.Duration ttl = 9;

  // Live group-knob hints: upsert the group's config so a brand-new group's
  // first message can carry its fairness weight without a second round-trip.
  // Authoritative config is SetGroupConfig.
  optional double weight = 10;
  optional uint32 batch_size = 11;

  string dedup_key = 12;                // producer-side idempotency window (optional)
  bool issue_token = 13;                // mint a completion token at lease time
  bytes external_token = 14;            // or supply your own external completion token
}

message RetryBackoff {
  google.protobuf.Duration base = 1;
  double multiplier = 2;                // e.g. 2.0
  google.protobuf.Duration max = 3;
}

message PublishRequest { MessageSpec message = 1; }
message PublishResponse { uint64 message_id = 1; }

message PublishBatchRequest {
  repeated MessageSpec messages = 1;
  bool atomic = 2;                      // true => one Raft write, all-or-nothing
}
message PublishBatchResponse {
  repeated PublishItemResult results = 1;
}
message PublishItemResult {
  uint64 message_id = 1;
  ErrorCode code = 2;                   // OK unless atomic=false partial failure
  string detail = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Work stream
// ─────────────────────────────────────────────────────────────────────────────

enum NackMode {
  // No-penalty requeue: attempt unchanged, optional redelivery delay. For
  // transient back-pressure (shutdown, rate-limit, circuit-open, paused race).
  REQUEUE_NO_PENALTY = 0;
  RETRY = 1;          // attempt++; auto-dead-letter once attempt >= max
  DEAD_LETTER = 2;    // terminal
}

enum Outcome {
  SUCCESS = 0;        // == Ack
  FAILURE = 1;        // == RETRY-or-DEAD_LETTER per lane
}

message WorkClientMsg {
  oneof msg {
    LeaseRequest lease_request = 1;
    Ack ack = 2;
    Nack nack = 3;
    ExtendVisibility extend = 4;
    Complete complete = 5;
  }
}

message LeaseRequest {
  string lane = 1;
  uint32 credit = 2;                    // additive in-flight budget; 1 => strictly serial
  repeated string group_allow = 3;      // optional filters
  repeated string group_deny = 4;
  string consumer_id = 5;
}
message Ack { uint64 lease_id = 1; }
message Nack {
  uint64 lease_id = 1;
  NackMode mode = 2;
  google.protobuf.Duration delay = 3;   // optional redelivery delay
  map<string, string> failure_meta = 4;
}
message ExtendVisibility {
  uint64 lease_id = 1;
  google.protobuf.Duration ttl = 2;
}
message Complete {
  bytes external_token = 1;             // keyed by token, so it may also arrive off-stream
  Outcome outcome = 2;
  map<string, string> result_meta = 3;
  google.protobuf.Duration delay = 4;
}

message WorkServerMsg {
  oneof msg {
    LeasedMessage lease = 1;
    CreditGrant credit = 2;
    ControlFrame control = 3;
    StreamError error = 4;
  }
}

message LeasedMessage {
  uint64 lease_id = 1;
  string lane = 2;
  string group_id = 3;
  bytes payload = 4;
  uint32 attempt = 5;
  map<string, string> headers = 6;
  google.protobuf.Timestamp visibility_deadline = 7;
  bytes external_token = 8;             // present in complete-by-token mode
  uint64 message_id = 9;
}

message CreditGrant {
  string lane = 1;
  uint32 granted = 2;
}

enum ControlKind {
  CONTROL_KIND_UNSPECIFIED = 0;
  PAUSE_LANE = 1;
  RESUME_LANE = 2;
  PAUSE_GROUP = 3;
  RESUME_GROUP = 4;
}
message ControlFrame {
  ControlKind kind = 1;
  string lane = 2;
  string group_id = 3;
}

enum ErrorCode {
  OK = 0;
  NOT_LEADER = 1;
  LEASE_EXPIRED = 2;
  UNKNOWN_LEASE = 3;
  POLICY_FAULT = 4;
  RATE_LIMITED = 5;
  UNKNOWN_TOKEN = 6;
  INTERNAL = 7;                         // per-item failure in a best-effort batch
}
message StreamError {
  ErrorCode code = 1;
  string detail = 2;
  uint64 lease_id = 3;
  string leader_addr = 4;               // set when code = NOT_LEADER
}

// NotLeader is attached as an error detail on unary RPCs that hit a follower.
message NotLeader {
  string leader_addr = 1;
  string leader_id = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Control-plane messages
// ─────────────────────────────────────────────────────────────────────────────

message LaneRef { string lane = 1; }
message GroupRef { string lane = 1; string group_id = 2; }

message LaneConfig {
  string lane = 1;
  double rate_per_sec = 2; // broker-side dequeue rate limit; 0 = unlimited
  uint32 burst = 3;
  bool paused = 4;
}
message SetLaneConfigRequest {
  string lane = 1;
  double rate_per_sec = 2;
  uint32 burst = 3;
}
message PauseLaneRequest {
  string lane = 1;
  google.protobuf.Duration duration = 2; // 0 = until explicitly resumed
}
message LaneOpResult { bool ok = 1; }

message GroupConfig {
  string lane = 1;
  string group_id = 2;
  double weight = 3;
  uint32 batch_size = 4;
  bool paused = 5;
}
message SetGroupConfigRequest {
  string lane = 1;
  string group_id = 2;
  optional double weight = 3;
  optional uint32 batch_size = 4;
}
message GroupOpResult {
  uint64 affected_messages = 1;
}
message TeardownRequest { string group_id = 1; }
message TeardownResult {
  repeated string affected_lanes = 1;
  uint64 affected_messages = 2;
}

// Policy management. The policy source is opaque code in a chosen engine; the
// broker compiles, validates, and hot-reloads it. Built-ins are expressed in
// the same mechanism.
enum PolicyKind {
  POLICY_KIND_UNSPECIFIED = 0;
  DRR = 1;
  STRICT_PRIORITY = 2;
  WFQ = 3;
  LOTTERY = 4;
  CUSTOM = 5;
  // Completion-aware WFQ: ranks by virtual time inflated by in-flight/weight, so
  // a tenant hogging leased-but-unacked capacity is de-prioritized, not just one
  // that takes many lease-turns. A built-in (engine "builtin", empty code).
  COMPLETION_AWARE = 6;
}
enum PolicyMode {
  POLICY_MODE_UNSPECIFIED = 0;
  SCORE = 1;     // policy returns one score per group; broker owns the mechanism
  DECIDE = 2;    // policy returns {group_id, take}; broker still owns deficit accounting
}
message PolicySource {
  PolicyKind kind = 1;
  PolicyMode mode = 2;
  string engine = 3;                    // "builtin" | "cel" | "wasm" | "starlark"
  bytes code = 4;                       // the policy source (empty for pure built-ins)
  map<string, string> params = 5;       // mechanism config (e.g. quantum)
}
message SetPolicyRequest {
  string lane = 1;
  PolicySource source = 2;
}
message PolicyInfo {
  string lane = 1;
  PolicySource source = 2;
  uint64 policy_version = 3;
  string source_hash = 4;               // sha256 of code
  uint64 fault_count = 5;
  bool quarantined = 6;
}
message ValidatePolicyResult {
  bool ok = 1;
  repeated string diagnostics = 2;
  double estimated_cost = 3;
}

// Cron.
enum MisfirePolicy {
  MISFIRE_POLICY_UNSPECIFIED = 0;
  FIRE_ONCE = 1;     // publish once, jump to next future slot
  FIRE_ALL = 2;      // publish per missed slot within grace
}
message ScheduleCronRequest {
  string cron_id = 1;                   // idempotent
  string lane = 2;
  string group_id = 3;
  bytes payload = 4;
  map<string, string> headers = 5;
  string schedule = 6;                  // UTC crontab
  string timezone = 7;
  MisfirePolicy misfire = 8;
  bool coalesce = 9;
  google.protobuf.Timestamp start_at = 10;
  google.protobuf.Timestamp end_at = 11;
}
message CronRef { string cron_id = 1; }
message CronInfo {
  string cron_id = 1;
  string lane = 2;
  string schedule = 3;
  uint64 next_fire_ms = 4;
  uint64 last_fire_ms = 5;
  bool paused = 6;
}
message ListCronRequest {
  string lane = 1;                      // optional filter
  uint32 next_n = 2;                    // include next-N occurrences per cron
}
message ListCronResponse {
  repeated CronInfo crons = 1;
  map<string, NextFires> next_fires = 2; // cron_id -> upcoming instants
}
message NextFires { repeated uint64 fire_ms = 1; }
message CronOpResult { bool existed = 1; }

// Singleton leases.
message SingletonLease {
  string name = 1;
  string holder = 2;
  uint64 deadline_ms = 3;
  uint64 fence = 4;                     // strictly-increasing fencing token
}
message AcquireSingletonRequest {
  string name = 1;
  string holder = 2;
  google.protobuf.Duration ttl = 3;
}
message RenewSingletonRequest {
  string name = 1;
  string holder = 2;
  uint64 fence = 3;
  google.protobuf.Duration ttl = 4;
}
message ReleaseSingletonRequest {
  string name = 1;
  string holder = 2;
  uint64 fence = 3;
}
message SingletonOpResult { bool released = 1; }

// Async completion off-stream.
message CompleteByTokenRequest {
  bytes external_token = 1;
  Outcome outcome = 2;
  map<string, string> result_meta = 3;
  google.protobuf.Duration delay = 4;
}
message CompleteResult {
  bool resolved = 1;
  bool unknown_token = 2;               // benign for at-least-once callbacks
}

// Introspection.
message GetStatsRequest {
  string lane = 1;                      // optional filter
  string group_id = 2;                  // optional filter
}
message StatsResponse {
  repeated LaneStats lanes = 1;
}
message LaneStats {
  string lane = 1;
  uint64 leasable = 2;
  uint64 delayed = 3;
  uint64 inflight = 4;
  uint64 dlq_depth = 5;
  double publish_rate = 6;              // EWMA
  double lease_rate = 7;
  double ack_rate = 8;
  uint64 oldest_age_ms = 9;
  uint64 group_count = 10;
  uint64 policy_version = 11;
}

// ─── Dashboard read API (paginated) ─────────────────────────────────────────────

message ListGroupsRequest {
  string lane = 1;                      // required
  uint32 page_size = 2;                 // 0 => server default (100); capped
  string page_token = 3;                // opaque; empty => first page
}
message GroupStats {
  string lane = 1;
  string group_id = 2;
  double weight = 3;
  bool paused = 4;
  uint64 ready = 5;
  uint64 delayed = 6;
  uint64 inflight = 7;
  uint64 total = 8;
  double virtual_time = 9;              // WFQ fairness clock (the grid's fairness signal)
  double deficit = 10;
  uint64 last_activity_ms = 11;
}
message ListGroupsResponse {
  repeated GroupStats groups = 1;
  string next_page_token = 2;           // empty => no more pages
}

message ListDeadLettersRequest {
  string lane = 1;                      // required
  uint32 page_size = 2;
  string page_token = 3;
}
message DeadLetterInfo {
  string lane = 1;
  string group_id = 2;
  uint64 msg_id = 3;
  uint32 final_attempt = 4;
  string reason = 5;                    // max_attempts | terminal_nack | ttl | max_lease_lifetime
  uint64 dead_at_ms = 6;
  map<string, string> failure_headers = 7;
  map<string, string> headers = 8;      // original message headers
  bytes payload = 9;
}
message ListDeadLettersResponse {
  repeated DeadLetterInfo dead_letters = 1;
  string next_page_token = 2;
}

// In-flight lease inspector. Leases are keyed globally by lease id; the server
// iterates the lease table and filters to the requested lane.
message ListLeasesRequest {
  string lane = 1;                      // required
  uint32 page_size = 2;
  string page_token = 3;
}
message LeaseInfo {
  string lane = 1;
  string group_id = 2;
  uint64 msg_id = 3;
  uint64 lease_id = 4;
  string consumer_id = 5;
  uint64 deadline_ms = 6;
  uint32 attempt = 7;
  uint32 epoch = 8;
  uint32 extend_count = 9;
}
message ListLeasesResponse {
  repeated LeaseInfo leases = 1;
  string next_page_token = 2;
}

// Non-destructive read of the head messages of a group (no state change).
message PeekMessagesRequest {
  string lane = 1;                      // required
  string group_id = 2;                  // required
  uint32 limit = 3;                     // capped server-side (<=200)
}
message MessagePeek {
  uint64 msg_id = 1;
  MessageState state = 2;
  uint32 attempt = 3;
  uint64 enqueue_ms = 4;
  uint64 not_before_ms = 5;
}
message PeekMessagesResponse {
  repeated MessagePeek messages = 1;
}

// ─── Fairness Observatory ───────────────────────────────────────────────────────
//
// A read-only, per-lane fairness snapshot derived from durable GroupMeta plus the
// leader's in-memory served-events projection (rolling window). It answers "is
// this lane fair right now, and who is starving?" without exposing scheduler
// internals.

// GroupFairness is the fairness state of one group in a lane.
message GroupFairness {
  string group_id = 1;
  double weight = 2;
  double expected_share = 3;   // weight / sum(weight over active groups)
  double actual_share = 4;     // served / total_served (rolling window)
  double virtual_time = 5;     // WFQ fairness clock (broker-maintained)
  double deficit = 6;          // how far behind the lane's max virtual time
  uint64 served = 7;           // served count in the rolling window
  double starvation_score = 8; // (now - last_served) * backlog * max(0, expected-actual), normalized [0,1]
  bool paused = 9;
}
message LaneFairness {
  string lane = 1;
  repeated GroupFairness groups = 2;
  uint64 total_served = 3;      // total served across the lane in the rolling window
}

// PolicyHealth is the live scheduling-policy status for a lane: which built-in /
// custom policy is bound, whether it has been quarantined after repeated faults,
// and the cumulative fallback-to-WFQ fault count.
message PolicyHealth {
  string lane = 1;
  uint64 version = 2;
  bool quarantined = 3;
  string engine = 4;           // "builtin" | "cel" | "wasm"
  uint64 faults = 5;           // fallback-to-WFQ evaluations observed
}

// Redrive a dead letter back onto its lane as a fresh READY message (attempt
// reset), deleting the DLQ row. Idempotent: a missing DLQ row is a no-op.
message RedriveDeadLetterRequest {
  string lane = 1;                      // required
  string group_id = 2;                  // required
  uint64 msg_id = 3;                    // required
}
message RedriveDeadLetterResponse {
  bool ok = 1;                          // false => no matching DLQ row (already redriven/absent)
  uint64 new_msg_id = 2;                // the re-published message's new per-group id
}

// Auth actions are intentionally small and resource-oriented. A grant authorizes
// one or more actions over lane/group regexes; the administrator tag bypasses
// resource checks for break-glass and bootstrap operators.
enum AuthAction {
  AUTH_ACTION_UNSPECIFIED = 0;
  AUTH_READ = 1;       // inspect cluster, lane, group, leases, DLQ, workflow state
  AUTH_PUBLISH = 2;    // publish work onto lanes/groups
  AUTH_CONSUME = 3;    // lease and settle work from lanes/groups
  AUTH_COMPLETE = 4;   // resolve complete-by-token callbacks
  AUTH_WORKFLOW = 5;   // start/signal/cancel/poll/respond workflow tasks
  AUTH_CONFIGURE = 6;  // mutate broker policy, lane/group config, cron, singleton, DLQ
  AUTH_ADMIN = 7;      // manage auth and bypass resource scoping
}
message AuthGrant {
  string lane_pattern = 1;              // RE2 regex; empty/"*" means all lanes
  string group_pattern = 2;             // RE2 regex; empty/"*" means all groups
  repeated AuthAction actions = 3;
  string note = 4;
}
message AuthTokenInfo {
  string token_id = 1;                  // stable identifier for auditing; not secret
  bytes salt = 2;                       // token hash salt, replicated
  bytes hash = 3;                       // sha256(salt || raw_token), replicated
  uint64 created_ms = 4;
  uint64 rotated_ms = 5;
}
message AuthPrincipal {
  string name = 1;
  bool disabled = 2;
  repeated string tags = 3;             // administrator | dashboard | monitoring
  repeated AuthGrant grants = 4;
  AuthTokenInfo token = 5;
  uint64 created_ms = 6;
  uint64 updated_ms = 7;
}
message CreatePrincipalRequest {
  string name = 1;
  repeated string tags = 2;
  repeated AuthGrant grants = 3;
}
message CreatePrincipalResponse {
  AuthPrincipal principal = 1;
  string token = 2;                     // shown exactly once
}
message RotatePrincipalTokenRequest { string name = 1; }
message RotatePrincipalTokenResponse {
  AuthPrincipal principal = 1;
  string token = 2;                     // shown exactly once
}
message SetPrincipalDisabledRequest {
  string name = 1;
  bool disabled = 2;
}
message GrantPrincipalRequest {
  string name = 1;
  AuthGrant grant = 2;
}
message RevokePrincipalGrantRequest {
  string name = 1;
  uint32 grant_index = 2;
}
message AuthOpResult {
  bool ok = 1;
  string detail = 2;
}
message ListPrincipalsRequest {}
message ListPrincipalsResponse {
  bool auth_enabled = 1;
  repeated AuthPrincipal principals = 2;
}
message DescribeClusterRequest {}
message ClusterInfo {
  string leader_id = 1;
  string leader_addr = 2;
  uint64 term = 3;
  uint64 applied_index = 4;
  repeated PeerInfo peers = 5;
}
message PeerInfo {
  string id = 1;
  string addr = 2;
  string suffrage = 3;                  // Voter | Nonvoter
}
message HealthRequest {}
message HealthResponse {
  bool serving = 1;
  bool has_quorum = 2;
  bool is_leader = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Durable execution (Phase 8). These are the engine-PRIVATE stored types: a
// workflow run and its append-only, per-run, totally-ordered event history. The
// history is the system of record for deterministic replay; it is addressed by
// run_id and never exposed as a consumer-subscribable stream (broker non-goal
// preserved — see docs/design/non-goals-reevaluation.md).
// ─────────────────────────────────────────────────────────────────────────────

enum WorkflowStatus {
  WF_PENDING = 0;
  WF_RUNNING = 1;
  WF_COMPLETED = 2;
  WF_FAILED = 3;
  WF_CANCELED = 4;
  WF_CONTINUED = 5;   // closed via continue-as-new (a successor run carries on)
}

// HistoryEventType is the kind of a recorded event. Command-events (produced by a
// worker's workflow task and validated by the leader) and external events
// (appended by the leader on its own authority) share this enum; the engine knows
// which are which.
enum HistoryEventType {
  HET_UNSPECIFIED = 0;
  HET_WORKFLOW_STARTED = 1;
  HET_WORKFLOW_TASK_SCHEDULED = 2;
  HET_WORKFLOW_TASK_COMPLETED = 3;
  HET_ACTIVITY_SCHEDULED = 4;
  HET_ACTIVITY_COMPLETED = 5;
  HET_ACTIVITY_FAILED = 6;
  HET_TIMER_STARTED = 7;
  HET_TIMER_FIRED = 8;
  HET_SIGNAL_RECEIVED = 9;
  HET_MARKER_RECORDED = 10;
  HET_WORKFLOW_COMPLETED = 11;
  HET_WORKFLOW_FAILED = 12;
  HET_WORKFLOW_CANCELED = 13;
  HET_WORKFLOW_CONTINUED_AS_NEW = 14;
}

// HistoryEvent is one entry in a run's history. event_id is a per-run monotonic
// gap-free sequence assigned in Apply; event_time_ms is leader-stamped. attrs is
// the type-specific payload (kept opaque at the kernel layer; the SDK encodes it).
message HistoryEvent {
  uint64 event_id = 1;
  HistoryEventType event_type = 2;
  uint64 event_time_ms = 3;
  bytes attrs = 4;
}

// WorkflowRun (RunMeta) is the quorum-written run record — the GroupMeta analogue
// for the engine. cur_history_seq is the highest committed event_id; run_epoch is a
// generation bumped on every workflow-task append, used as the optimistic-
// concurrency fence so two appends against the same (epoch, seq) cannot both commit.
message WorkflowRun {
  uint64 run_id = 1;
  string workflow_type = 2;            // = lane, for fair dispatch later
  string tenant_id = 3;                // = group_id, the fairness unit
  WorkflowStatus status = 4;
  uint32 run_epoch = 5;
  uint64 cur_history_seq = 6;
  bytes input = 7;
  uint64 started_ms = 8;
  uint64 last_event_ms = 9;
  uint64 parent_run_id = 10;           // 0 for a root run
  bool wf_task_pending = 11;           // a workflow task is dispatched & not yet completed (dedup)
}

// WorkflowTaskRef is the payload of a dispatched workflow-task message on
// __wf/<type> (group = run_id). A worker leases it, fetches the run's history,
// replays, decides, and completes the workflow task.
message WorkflowTaskRef {
  uint64 run_id = 1;
  string workflow_type = 2;
}

// Activity dispatch (Phase 8). An ACTIVITY_SCHEDULED history event carries these
// attrs; on apply the engine publishes an ActivityTask message onto __act/<type>
// (group = tenant) so a NORMAL worker leases it — activities ARE leases. The task
// payload carries run_id + scheduled_event_id so the completion routes back into
// the run's history.
message ActivityScheduledAttrs {
  string activity_type = 1;
  string tenant_id = 2;
  bytes input = 3;
}
message ActivityCompletedAttrs {
  uint64 scheduled_event_id = 1;
  bool success = 2;
  bytes result = 3;
}
message ActivityTask {
  uint64 run_id = 1;
  uint64 scheduled_event_id = 2;
  string activity_type = 3;
  bytes input = 4;
}

// Durable timer (workflow.sleep) event attrs. TIMER_STARTED carries the
// leader-stamped absolute fire time; on apply the engine arms a TimerWFFired entry
// on the unified time wheel. When it fires, TIMER_FIRED is appended referencing the
// started event so a replaying worker resolves its sleep deterministically.
message TimerStartedAttrs {
  uint64 fire_at_ms = 1;
}
message TimerFiredAttrs {
  uint64 started_event_id = 1;
}

// Signal delivery: SIGNAL_RECEIVED is appended to a running run (an external event)
// and dispatches a workflow task so the workflow code can react to it on replay.
message SignalReceivedAttrs {
  string signal_name = 1;
  bytes payload = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Workflow service (Phase 8 durable execution). Mutating RPCs are leader-guarded;
// the read RPCs are follower-servable.
// ─────────────────────────────────────────────────────────────────────────────
service Workflow {
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);
  rpc SignalWorkflow(SignalWorkflowRequest) returns (SignalWorkflowResponse);
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);
  rpc GetWorkflowRun(WorkflowRunRef) returns (WorkflowRun);
  rpc GetWorkflowHistory(WorkflowRunRef) returns (GetWorkflowHistoryResponse);
  rpc ListWorkflowRuns(ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);

  // Worker protocol (language-agnostic; an SDK in any language drives the engine).
  // Poll leases a task; Respond submits the result and acks the lease. Leader-guarded.
  rpc PollWorkflowTask(PollTaskRequest) returns (PolledWorkflowTask);
  rpc RespondWorkflowTask(RespondWorkflowTaskRequest) returns (RespondWorkflowTaskResponse);
  rpc PollActivityTask(PollTaskRequest) returns (PolledActivityTask);
  rpc RespondActivityTask(RespondActivityTaskRequest) returns (RespondActivityTaskResponse);
}

message PollTaskRequest {
  string task_type = 1;     // workflow type or activity type
  string consumer_id = 2;
}
// PolledWorkflowTask carries the run's full history so the worker replays + decides.
// empty=true means no task was available.
message PolledWorkflowTask {
  bool empty = 1;
  uint64 run_id = 2;
  uint64 lease_id = 3;
  uint32 run_epoch = 4;
  uint64 history_seq = 5;
  repeated HistoryEvent history = 6;
}
message WorkflowCommandProto {
  string kind = 1;          // schedule_activity | start_timer | continue_as_new | complete_workflow | fail_workflow
  string activity_type = 2;
  bytes input = 3;
  bytes result = 4;
  uint64 delay_ms = 5;
}
message RespondWorkflowTaskRequest {
  uint64 run_id = 1;
  uint64 lease_id = 2;
  uint32 run_epoch = 3;
  uint64 history_seq = 4;
  bytes prefix_checksum = 5;
  repeated WorkflowCommandProto commands = 6;
}
message RespondWorkflowTaskResponse {
  bool applied = 1;
  string reason = 2;        // "" | stale | non_determinism | closed | checksum_required
}
message PolledActivityTask {
  bool empty = 1;
  uint64 run_id = 2;
  uint64 lease_id = 3;
  uint64 scheduled_event_id = 4;
  string activity_type = 5;
  bytes input = 6;
}
message RespondActivityTaskRequest {
  uint64 run_id = 1;
  uint64 lease_id = 2;
  uint64 scheduled_event_id = 3;
  bool success = 4;
  bytes result = 5;
}
message RespondActivityTaskResponse {}

message StartWorkflowRequest {
  string workflow_type = 1;
  string tenant_id = 2;
  bytes input = 3;
}
message StartWorkflowResponse { uint64 run_id = 1; }
message SignalWorkflowRequest {
  uint64 run_id = 1;
  string signal_name = 2;
  bytes payload = 3;
}
message SignalWorkflowResponse {}
message CancelWorkflowRequest {
  uint64 run_id = 1;
  bytes reason = 2;
}
message CancelWorkflowResponse { bool canceled = 1; }
message WorkflowRunRef { uint64 run_id = 1; }
message GetWorkflowHistoryResponse { repeated HistoryEvent events = 1; }
message ListWorkflowRunsRequest {
  WorkflowStatus status = 1;       // filter (only applied when has_status)
  bool has_status = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ListWorkflowRunsResponse {
  repeated WorkflowRun runs = 1;
  string next_page_token = 2;
}

// Continue-as-new closes a run (status CONTINUED) and atomically starts a successor
// with this carried input and a FRESH, empty history — bounding per-run history for
// long-running / looping workflows.
message ContinueAsNewAttrs {
  bytes input = 1;
}

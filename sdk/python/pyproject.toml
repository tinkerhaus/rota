[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rota"
version = "0.1.0"
description = "Thin, domain-neutral Python SDK for the Rota fair-scheduling message broker."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Rota" }]
keywords = ["rota", "broker", "grpc", "queue", "fair-scheduling", "message-broker"]
dependencies = [
    "grpcio>=1.81.0",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
# Needed only to regenerate the gRPC stubs from the proto.
codegen = ["grpcio-tools>=1.81.0"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rota*"]

[tool.setuptools.package-data]
rota = ["py.typed"]
